<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One-time meal import</title>
    <style>
      body { max-width: 38rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
      label { display: block; margin: 1rem 0 .3rem; }
      input, button { box-sizing: border-box; width: 100%; padding: .65rem; }
      button { margin-top: 1rem; cursor: pointer; }
      #status { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>One-time meal import</h1>
    <p>Select <code>meals.xlsx</code>, then sign in with the shared Firebase account. The password is used only for this sign-in and is not saved.</p>
    <form id="import-form">
      <label for="workbook">Excel workbook</label>
      <input id="workbook" type="file" accept=".xlsx" required />
      <label for="email">Firebase account email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Firebase account password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">Sign in and import meals</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="./import-meals.js"></script>
  </body>
</html>
